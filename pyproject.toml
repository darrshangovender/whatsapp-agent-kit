[project]
name = "whatsapp-agent-kit"
version = "0.1.0"
description = "Stateful LLM agent framework for WhatsApp Business — webhook dedup, 24h window, flows, human handoff, POPIA-aware PII handling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Darrshan Govender", email = "darrshangovender@gmail.com" }]
keywords = ["whatsapp", "llm", "agents", "chatbot", "popia", "meta-cloud-api", "south-africa"]
dependencies = [
    "pydantic>=2.7",
    "starlette>=0.37",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]
server = ["uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/darrshangovender/whatsapp-agent-kit"
Issues = "https://github.com/darrshangovender/whatsapp-agent-kit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wa_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
